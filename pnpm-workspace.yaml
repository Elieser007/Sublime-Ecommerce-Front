# pnpm workspace configuration for the Astro storefront (Cloudflare Pages).
#
# Supply-chain policy: pnpm 11 applies `minimumReleaseAge` (24 h) by default and
# `pnpm install --frozen-lockfile` fails hard when a lockfile entry was
# published inside that window. The opt-out that used to live here and in
# .npmrc disabled the gate; the exact pins below remove the cause instead.
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  sharp: true

# Exact pins for security fixes on transitive dependencies. These ranges used
# to re-resolve to the newest matching release on every lockfile regeneration,
# which is exactly what tripped the release-age gate in the backend repo
# (postcss -> nanoid). Keep them exact.
#
# devalue, fast-uri, js-yaml, sharp, smol-toml, source-map-js and svgo are
# pinned to the patched versions required by the open Dependabot advisories.
overrides:
  devalue: 5.9.4
  fast-uri: 3.1.8
  js-yaml: 4.3.2
  nanoid: 3.3.18
  sharp: 0.35.5
  smol-toml: 1.9.0
  source-map-js: 1.2.2
  svgo: 4.1.0
